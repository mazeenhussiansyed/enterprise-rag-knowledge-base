[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazen-enterprise-rag"
version = "0.1.0"
description = "Evidence-first enterprise policy RAG with measurable hybrid retrieval"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "fastembed==0.8.0",
    "gradio>=5.0,<7",
    "pypdf>=6.0,<7",
    "qdrant-client==1.19.0",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]