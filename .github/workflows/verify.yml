name: Verify Enterprise RAG

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and start the containerized stack
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Verify API health
        run: curl --fail --silent http://127.0.0.1:8000/health

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit, API and live Qdrant integration tests
        run: RUN_QDRANT_INTEGRATION=1 python -m unittest discover -s tests -v

      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100

      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans